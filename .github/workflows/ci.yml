name: Validate Arkmatx Deploy

on:
  push:
    branches: [main, dev/platform-v1]
    paths-ignore: ["receipts/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Advisory lint
        run: ruff check app tests --exit-zero
      - name: Compile Python
        run: python -m compileall -q app
      - run: pytest -q
      - name: Validate frontend markers
        run: |
          grep -Fq 'ARKMATX DEPLOY' frontend/index.html
          grep -Fq 'TEST BUILD' frontend/index.html
          grep -Fq 'credentials_saved' app/network.py
      - name: Record verified CI receipt
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          branch_name="${GITHUB_REF_NAME}"
          mkdir -p receipts
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > receipts/ci.json <<EOF
          {
            "branch": "${branch_name}",
            "source_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "verified_at_utc": "${verified_at}",
            "status": "verified"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add receipts/ci.json
          git commit -m 'Record verified Arkmatx CI [skip ci]' || exit 0
          git pull --rebase origin "${branch_name}"
          git push origin HEAD:"${branch_name}"
