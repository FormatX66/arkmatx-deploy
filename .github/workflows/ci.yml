name: Validate Arkmatx Deploy

on:
  push:
    branches: [main, dev/platform-v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q
      - name: Validate frontend markers
        run: |
          grep -Fq 'ARKMATX DEPLOY' frontend/index.html
          grep -Fq 'TEST BUILD' frontend/index.html
          grep -Fq 'credentials_saved' app/network.py
