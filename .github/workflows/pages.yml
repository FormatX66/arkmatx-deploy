name: Validate mobile test preview

on:
  push:
    branches: [main, dev/platform-v1]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-preview
  cancel-in-progress: true

env:
  PREVIEW_URL: https://raw.githack.com/FormatX66/arkmatx-deploy/main/frontend/index.html

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Validate static mobile preview
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/index.html
          grep -Fq 'ARKMATX DEPLOY' frontend/index.html
          grep -Fq 'TEST BUILD' frontend/index.html
          test -s frontend/app.js
          test -s frontend/app.css

      - name: Publish preview link in workflow summary
        shell: bash
        run: |
          {
            echo '## Arkmatx Deploy mobile preview'
            echo
            echo "Open: ${PREVIEW_URL}"
            echo
            echo "Source commit: ${GITHUB_SHA}"
            echo
            echo 'GitHub Pages remains optional; this preview requires no repository Pages setting.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record verified preview receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > receipts/preview.json <<EOF
          {
            "url": "${PREVIEW_URL}",
            "branch": "main",
            "source_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "verified_at_utc": "${verified_at}",
            "status": "verified-live"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add receipts/preview.json
          git commit -m 'Record verified mobile preview [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
